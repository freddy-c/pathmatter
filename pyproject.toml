[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[project]
name = "pathmatter"
version = "0.1.0"
description = "A query language for filesystem Markdown and frontmatter"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "chromadb>=1.3,<2",
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "jsonschema>=4.26,<5",
    "markdown-it-py>=4,<5",
    "mcp>=1.26,<2",
    "onnxruntime==1.23.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
pathmatter = "pathmatter.cli:main"
pathmatter-mcp = "pathmatter.mcp_server:main"
