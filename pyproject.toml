[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[project]
name = "pathmatter"
version = "0.1.0"
description = "A query language for filesystem Markdown and frontmatter"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "jsonschema>=4.26,<5",
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
pathmatter = "pathmatter.cli:main"
